["dürfen","may, to be allowed to",["darf","darfst","darf","dürfen","dürft","dürfen"],["Ich darf heute länger schlafen.","Du darfst hier parken.","Er darf nicht rauchen.","Wir dürfen heute früher gehen.","Ihr dürft jetzt nach Hause gehen.","Sie dürfen hier nicht fotografieren."]],
["können","can, to be able to",["kann","kannst","kann","können","könnt","können"],["Ich kann Deutsch und Englisch sprechen.","Du kannst gut kochen.","Sie kann sehr gut Spanisch.","Wir können morgen kommen.","Ihr könnt mir helfen.","Sie können mich anrufen."]],
["mögen","to like",["mag","magst","mag","mögen","mögt","mögen"],["Ich mag die Tiere sehr.","Du magst Kaffee.","Er mag den Hund.","Wir mögen die Stadt.","Ihr mögt Pizza, oder?","Sie mögen Musik."]],
["möchten","would like to",["möchte","möchtest","möchte","möchten","möchtet","möchten"],["Ich möchte ein Wasser, bitte.","Du möchtest bestimmt einen Kaffee.","Der Chef möchte mit Ihnen sprechen.","Wir möchten einen Tisch reservieren.","Möchtet ihr etwas essen?","Sie möchten bald umziehen."]],
["müssen","must, to have to",["muss","musst","muss","müssen","müsst","müssen"],["Ich muss heute lange arbeiten.","Du musst mehr Wasser trinken.","Er muss zum Chef gehen.","Wir müssen jetzt gehen.","Ihr müsst die Hausaufgaben machen.","Sie müssen den Termin bestätigen."]],
["sollen","should, to be supposed to",["soll","sollst","soll","sollen","sollt","sollen"],["Ich soll morgen früher kommen.","Du sollst Anastasia anrufen.","Er soll das Fest organisieren.","Wir sollen heute lernen.","Ihr sollt leise sein.","Sie sollen das Formular ausfüllen."]],
["wollen","to want to",["will","willst","will","wollen","wollt","wollen"],["Ich will Deutsch lernen.","Du willst ins Fitnessstudio gehen.","Sie will Spanisch lernen.","Wir wollen heute ins Theater gehen.","Ihr wollt ins Restaurant gehen.","Sie wollen im Park spazieren gehen."]]
];
var T={"dürfen":["durfte","hat gedurft"],"können":["konnte","hat gekonnt"],"mögen":["mochte","hat gemocht"],"möchten":["– (wollte)","–"],"müssen":["musste","hat gemusst"],"sollen":["sollte","hat gesollt"],"wollen":["wollte","hat gewollt"]};
function modals(){
 var h="<p class='meta'>Modal verb in position 2, the other verb as an infinitive at the end: <i>Ich <b>kann</b> Deutsch <b>sprechen</b>.</i></p><div class='wrap'><table><tr><th>Verb</th><th>Meaning</th>"+P.map(function(x){return"<th>"+x+"</th>"}).join("")+"<th>Präteritum (ich/er)</th><th>Perfekt</th></tr>";
 M.forEach(function(m){h+="<tr><td><b>"+m[0]+"</b></td><td>"+m[1]+"</td>"+m[2].map(function(f){return"<td>"+f+"</td>"}).join("")+"<td>"+T[m[0]][0]+"</td><td>"+T[m[0]][1]+"</td></tr>"});
 h+="</table></div>";
 M.forEach(function(m){
  h+="<h2>"+m[0]+"</h2><div class='wrap'><table><tr><th>Person</th><th>Example</th></tr>";
  m[3].forEach(function(e,i){h+="<tr><td>"+P[i]+" <b>"+m[2][i]+"</b></td><td>"+e+"</td></tr>"});
  h+="</table></div>";
 });
 return [h,M.length,M.length];
}
var tab="Nouns",fc="All",fa="All",fg="All",fk="All";
function srt(a,b){return a[1].localeCompare(b[1],"de")}
function bar(){
 var t="";["Nouns","Verbs","Modals"].forEach(function(x){t+="<button class='"+(x===tab?"on":"")+"' data-t='"+x+"'>"+x+"</button> "});
 var groups=tab==="Modals"?[]:tab==="Nouns"?[["c",["All","Akk","Dat","Gen"],fc]]:[["a",["All","haben","sein"],fa],["g",["All","irregular","separable","reflexive"],fg],["k",["All","Akk","Dat"],fk]];
 var f="";
 groups.forEach(function(g,i){
  if(i)f+="<span class='sep'></span>";
  g[1].forEach(function(x){f+="<button class='"+(x===g[2]?"on":"")+"' data-k='"+g[0]+"' data-f='"+x+"'>"+x+"</button> "});
 });
 document.getElementById("tabs").innerHTML=t;document.getElementById("filters").innerHTML=f;
 document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.dataset.t;bar();render()}});
 document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){var k=b.dataset.k,v=b.dataset.f;if(k==="c")fc=v;else if(k==="a")fa=v;else if(k==="g")fg=v;else fk=v;bar();render()}});
}
function nouns(){
 var G=[["der","der (masculine)","Often der: days, months, seasons (der Juni, der Herbst) and many words from verbs (der Kurs, der Spaß)."],
 ["die","die (feminine and plural)","Always die: -ung, -heit, -keit, -ion, -in (female persons), most words ending in -e. Plural nouns use die in Nominativ and Akkusativ; Dativ plural is den + noun-n."],
 ["das","das (neuter)","Often das: -um, -chen, -lein, -ment, and verbs used as nouns (das Leben)."]];
 var h="",n=0;
 G.forEach(function(g){
  var r=N.filter(function(w){return w[0]===g[0]&&(fc==="All"||w[3]===fc)}).sort(srt);n+=r.length;
  h+="<h2>"+g[1]+" ("+r.length+")</h2><p class='meta'>"+g[2]+"</p>";
  if(!r.length)return;
  h+="<div class='wrap'><table><tr><th>Word</th><th>Plural</th><th>Case</th><th>Meaning</th><th>Example</th></tr>";
  r.forEach(function(w){h+="<tr><td><b>"+w[0]+" "+w[1]+"</b></td><td>"+w[2]+"</td><td><span class='b "+w[3]+"'>"+w[3]+"</span></td><td>"+w[4]+"</td><td>"+w[5]+"</td></tr>"});
  h+="</table></div>";
 });
 if(fc==="Gen")h+="<p class='meta'>No Genitiv words collected yet.</p>";
 return [h,n,N.length];
}
function verbs(){
 var r=V.filter(function(v){return (fa==="All"||v[3]===fa)&&(fg==="All"||v[7].indexOf(fg)>-1)&&(fk==="All"||v[6].indexOf(fk)>-1)}).sort(function(a,b){return a[0].replace("sich ","").localeCompare(b[0].replace("sich ",""),"de")});
 var h=(r.length?"":"<p class='meta'>No verbs match these filters.</p>")+"<p class='meta'>Perfekt = helper verb + participle. Orange = uses <b>sein</b> (movement or change of state). Präteritum is given for er/sie/es.</p><div class='wrap'><table><tr><th>Infinitive</th><th>Meaning</th><th>Präsens (ich / er)</th><th>Perfekt</th><th>Präteritum</th><th>Takes</th><th>Example</th></tr>";
 r.forEach(function(v){
  var tags=v[7]?v[7].split(", ").map(function(t){return"<span class='b'>"+t+"</span>"}).join(""):"";
  h+="<tr><td><b>"+v[0]+"</b><br>"+tags+"</td><td>"+v[1]+"</td><td>"+v[2]+"</td><td><span class='b "+(v[3]==="sein"?"sein":"")+"'>"+v[3]+"</span> "+v[4]+"</td><td>"+v[5]+"</td><td>"+(v[6]?"<span class='b "+(v[6].indexOf("Dat")>-1&&v[6].indexOf("Akk")<0?"Dat":v[6]==="Akk"?"Akk":"")+"'>"+v[6]+"</span>":"–")+"</td><td>"+v[8]+"</td></tr>";
 });
 return [h+"</table></div>",r.length,V.length];
}
function render(){
 var o=tab==="Nouns"?nouns():tab==="Modals"?modals():verbs();
 document.getElementById("out").innerHTML=o[0];
 document.getElementById("count").textContent=tab+": "+o[1]+" of "+o[2]+" shown";
}
bar();render();
</script>
</body>
</html>
